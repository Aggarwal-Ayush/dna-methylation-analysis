# DNA methylation pipeline configuration
# Save as dnam_config.yml (or config.yml) in your project root.

project_dir: "."
sample_sheet: "data/test-450k/sample_sheet_test.csv"
results_dir: "results"
run_name: "test"

# Column names in the sample sheet
sample_id_col: "Sample_ID"
sample_sex_col: "Sex"

# Optional differential methylation (skipped if the column is absent)
condition_col: "Condition"
condition_reference: "Dura"     # baseline level; null = first level alphabetically
condition_covariates: null    # optional extra sample sheet columns, e.g. ["Sex"]

# Execution
ncores: 8
seed: 123

# Preprocessing / QC
mask_threshold: 1
collapse_betas: true
run_classifier: true

# Control normal selection
# Use NULL to let the pipeline infer defaults.
platform: null
custom_normal: null
genes_to_annotate: "default"

# CNA calling
# Use density plot in cna-report.pdf to determine the appropriate cutoff
chr_length_cut: 5
segment_cut_loss: -0.25
segment_cut_gain: 0.15

# Notes:
# - sample_sheet must contain a Basename column pointing to IDAT basenames.
# - If Sample_ID is missing, the pipeline can derive it from Basename.
# - If Sex is missing, sex-mismatch QC will be skipped.
